apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes: # Define volume
        - name: images
          persistentVolumeClaim:
            claimName: project-claim
      containers:
        - name: todo-app
          image: sybercat/todo-app:2.2
          volumeMounts: # Mount volume
          - name: images
            mountPath: /app/images
          env:
            - name: PORT
              value: "3000"
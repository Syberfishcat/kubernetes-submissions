<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Todo App</title>
  <style>
    body { font-family: Helvetica, Arial, sans-serif; text-align: center; margin: 40px; }
    h1 { color: #333; }
    img { width: 460px; max-width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
    p { color: #777; }
    form { margin: 30px 0 10px; }
    input { width: 320px; padding: 8px; border: 2px solid #4caf50; border-radius: 4px; }
    button { padding: 9px 16px; margin-left: 8px; border: 0; border-radius: 4px; background: #4caf50; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; max-width: 520px; margin: 0 auto; text-align: left; }
    li { padding: 10px 12px; margin: 8px 0; background: #f9f9f9; border-left: 4px solid #4caf50; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Todo App</h1>
  <img src="/image">
  <form id="form">
    <input id="todo" type="text" maxlength="140" placeholder="Enter a new todo (max 140 characters)">
    <button type="submit">Send</button>
  </form>
  <h2>Todos</h2>
  <ul id="list"></ul>
  <p>DevOps with Kubernetes 2026</p>
  <script src="/script.js"></script>
</body>
</html>

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes: # Define volume
        - name: shared-logs
          persistentVolumeClaim:
            claimName: logs-claim
      containers:
        - name: ping-pong
          image: sybercat/ping-pong:1.11
          volumeMounts: # Mount volume
          - name: shared-logs
            mountPath: /app/logs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes: # Define volume
        - name: shared-logs
          persistentVolumeClaim:
            claimName: logs-claim
        - name: config
          configMap:
            name: log-output-config
            items:
              - key: information.txt
                path: information.txt
      containers:
        - name: log-generator
          image: sybercat/log-generator:2.1
          volumeMounts: # Mount volume
          - name: shared-logs
            mountPath: /app/logs
        - name: log-reader
          image: sybercat/log-reader:2.5
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          volumeMounts:
          - name: shared-logs
            mountPath: /app/logs
          - name: config
            mountPath: /config

apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes: # Define volume
        - name: shared-logs
          emptyDir: {}
      containers:
        - name: log-generator
          image: sybercat/log-generator:1.10
          volumeMounts: # Mount volume
          - name: shared-logs
            mountPath: /app/logs
        - name: log-reader
          image: sybercat/log-reader:1.10
          volumeMounts: # Mount volume
          - name: shared-logs
            mountPath: /app/logs